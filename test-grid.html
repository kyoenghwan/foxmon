<!DOCTYPE html>
<html>
<head>
<style>
  .container { max-width: 1100px; margin: 0 auto; background: #eee; padding: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, 200px);
    justify-content: center;
    gap: 16px;
  }
  .item { width: 200px; height: 100px; background: red; }
</style>
</head>
<body>
  <div class="container">
    <div class="grid">
      <div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div><div class="item"></div>
    </div>
  </div>
</body>
</html>
